name: release

# 수동 실행만 한다(Actions 탭 → release → Run workflow, 또는 `task release:ci`).
# 먼저 버전을 올려 main에 push해 둬야 한다. 서명 빌드 → 초안 업로드(DMG·업데이트 파일·latest.json) → 공개 → Homebrew tap 갱신.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 서명 키 확인
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Secret TAURI_SIGNING_PRIVATE_KEY가 없습니다 (DEPLOY.md 참고)"; exit 1; }
      - run: pnpm tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
      # update-tap.mjs가 tap 저장소에 커밋하므로 러너에 git 작성자 정보가 있어야 한다
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: bash scripts/release.sh publish
        env:
          SKIP_BUILD: "1"
          TAP_URL: https://x-access-token:${{ secrets.TAP_GITHUB_TOKEN }}@github.com/gyuha/homebrew-tap.git
