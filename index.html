<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>markview</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="chrome">
      <div id="tabbar" role="tablist"></div>
      <div id="theme" role="radiogroup" aria-label="테마">
        <button
          type="button"
          class="theme-option"
          role="radio"
          data-choice="light"
          aria-label="라이트"
          aria-checked="false"
          title="라이트"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
            />
          </svg>
        </button>
        <button
          type="button"
          class="theme-option"
          role="radio"
          data-choice="dark"
          aria-label="다크"
          aria-checked="false"
          title="다크"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.8A8.5 8.5 0 0 1 9.2 3.5a7.5 7.5 0 1 0 11.3 11.3Z" />
          </svg>
        </button>
        <button
          type="button"
          class="theme-option"
          role="radio"
          data-choice="system"
          aria-label="시스템"
          aria-checked="false"
          title="시스템"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M9 20h6M12 16v4" />
          </svg>
        </button>
      </div>
    </header>
    <div id="panes">
      <p id="empty">마크다운 파일을 이 창으로 끌어다 놓으세요.</p>
    </div>
    <div id="notice" hidden></div>
  </body>
</html>
