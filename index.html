<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>markview</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="chrome">
      <div id="tabbar" role="tablist"></div>
    </header>
    <div id="toolbar">
      <div id="format" aria-label="서식">
        <button type="button" class="fmt fmt-glyph" data-format="bold" aria-label="굵게" title="굵게 (⌘B)">
          B
        </button>
        <button
          type="button"
          class="fmt fmt-glyph fmt-italic"
          data-format="italic"
          aria-label="기울임"
          title="기울임 (⌘I)"
        >
          I
        </button>
        <button
          type="button"
          class="fmt fmt-glyph fmt-strike"
          data-format="strike"
          aria-label="취소선"
          title="취소선"
        >
          S
        </button>
        <span class="fmt-sep"></span>
        <div class="fmt-wrap">
          <button
            type="button"
            class="fmt fmt-menu"
            data-popover="heading"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="헤딩"
            title="헤딩"
          >
            <span class="fmt-menu-label">H</span><span class="fmt-caret" aria-hidden="true">▾</span>
          </button>
          <div
            class="popover"
            data-popover-for="heading"
            role="menu"
            aria-label="헤딩"
            hidden
          >
            <button type="button" role="menuitemradio" data-format="h1" aria-checked="false">
              제목 1
            </button>
            <button type="button" role="menuitemradio" data-format="h2" aria-checked="false">
              제목 2
            </button>
            <button type="button" role="menuitemradio" data-format="h3" aria-checked="false">
              제목 3
            </button>
            <button type="button" role="menuitemradio" data-format="h0" aria-checked="false">
              해제
            </button>
          </div>
        </div>
        <span class="fmt-sep"></span>
        <button type="button" class="fmt" data-format="list" aria-label="목록" title="목록">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6h11M9 12h11M9 18h11" />
            <circle cx="4.5" cy="6" r="1.3" />
            <circle cx="4.5" cy="12" r="1.3" />
            <circle cx="4.5" cy="18" r="1.3" />
          </svg>
        </button>
        <button
          type="button"
          class="fmt"
          data-format="ordered"
          aria-label="번호 목록"
          title="번호 목록"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 6h10M10 12h10M10 18h10" />
            <path d="M3 4.5 4.5 4v4M3 11h3l-3 3h3M3 16.5h3v1.5h-3v1.5h3" />
          </svg>
        </button>
        <span class="fmt-sep"></span>
        <div class="fmt-wrap">
          <button
            type="button"
            class="fmt fmt-menu"
            data-popover="code"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="코드"
            title="코드"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 7l-5 5 5 5M15 7l5 5-5 5" />
            </svg>
            <span class="fmt-caret" aria-hidden="true">▾</span>
          </button>
          <div class="popover" data-popover-for="code" role="menu" aria-label="코드" hidden>
            <button type="button" role="menuitem" data-format="code">인라인</button>
            <button type="button" role="menuitem" data-format="codeblock">코드 블록</button>
          </div>
        </div>
        <button type="button" class="fmt" data-format="quote" aria-label="인용" title="인용">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5v14" />
            <path d="M10 7h10M10 12h10M10 17h6" />
          </svg>
        </button>
        <span class="fmt-sep"></span>
        <button type="button" class="fmt" data-format="link" aria-label="링크" title="링크">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7l-1.2 1.2" />
            <path d="M14 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 1 0 5.7 5.7l1.2-1.2" />
          </svg>
        </button>
        <button type="button" class="fmt" data-format="image" aria-label="이미지" title="이미지">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="8.5" cy="10" r="1.5" />
            <path d="M5 17l4.5-4.5L13 16l3-2.5 3 3" />
          </svg>
        </button>
      </div>
      <div id="toolbar-right">
        <div id="view-mode" role="radiogroup" aria-label="보기 모드">
          <button
            type="button"
            class="mode-option"
            role="radio"
            data-mode="edit"
            aria-label="편집"
            aria-checked="false"
            title="편집 전용"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16v4Z" />
              <path d="M14 6l4 4" />
            </svg>
          </button>
          <button
            type="button"
            class="mode-option"
            role="radio"
            data-mode="split"
            aria-label="분할"
            aria-checked="false"
            title="분할 (⌘E)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M12 4v16" />
            </svg>
          </button>
          <button
            type="button"
            class="mode-option"
            role="radio"
            data-mode="view"
            aria-label="보기"
            aria-checked="false"
            title="보기 전용 (⌘E)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z" />
              <circle cx="12" cy="12" r="2.6" />
            </svg>
          </button>
        </div>
        <div id="theme" role="radiogroup" aria-label="테마">
          <button
            type="button"
            class="theme-option"
            role="radio"
            data-choice="light"
            aria-label="라이트"
            aria-checked="false"
            title="라이트"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
              />
            </svg>
          </button>
          <button
            type="button"
            class="theme-option"
            role="radio"
            data-choice="dark"
            aria-label="다크"
            aria-checked="false"
            title="다크"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.8A8.5 8.5 0 0 1 9.2 3.5a7.5 7.5 0 1 0 11.3 11.3Z" />
            </svg>
          </button>
          <button
            type="button"
            class="theme-option"
            role="radio"
            data-choice="system"
            aria-label="시스템"
            aria-checked="false"
            title="시스템"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2" />
              <path d="M9 20h6M12 16v4" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="panes">
      <p id="empty">마크다운 파일을 이 창으로 끌어다 놓으세요.</p>
    </div>
    <div id="notice" hidden></div>
  </body>
</html>
